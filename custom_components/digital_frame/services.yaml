show_message:
  name: Show message
  description: Temporarily show a message on the photo frame.
  fields:
    entry_id:
      name: Config entry
      description: Optional entry_id when you have multiple frames.
      example: "01J..."
    title:
      name: Title
      example: "Laundry is ready"
      selector:
        text:
    message:
      name: Message
      required: true
      example: "Please empty it."
      selector:
        text:
          multiline: true
    duration:
      name: Duration
      description: Seconds before returning to the previous mode. Use 0 to stay on this message.
      default: 60
      example: 60
      selector:
        number:
          min: 0
          max: 86400
          step: 1
          mode: box
          unit_of_measurement: s
    accent:
      name: Accent color
      default: "#d5a849"
      example: "#d5a849"
      selector:
        text:

send_message:
  name: Send message
  description: Temporarily send a message to the photo frame. This is the recommended action for automations.
  fields:
    entry_id:
      name: Config entry
      description: Optional entry_id when you have multiple frames.
      example: "01J..."
    title:
      name: Title
      example: "Laundry is ready"
      selector:
        text:
    message:
      name: Message
      required: true
      example: "Please empty it."
      selector:
        text:
          multiline: true
    duration:
      name: Duration
      description: Seconds before returning to the previous mode. Use 0 to stay on this message.
      default: 60
      example: 60
      selector:
        number:
          min: 0
          max: 86400
          step: 1
          mode: box
          unit_of_measurement: s
    accent:
      name: Accent color
      default: "#d5a849"
      example: "#d5a849"
      selector:
        text:

show_url:
  name: Show URL
  description: Open a single web page fullscreen on the photo frame.
  fields:
    entry_id:
      name: Config entry
    url:
      name: URL
      required: true
      example: "http://homeassistant.local:8123/lovelace/0?kiosk"

show_page:
  name: Show saved page
  description: Show a page saved in the photo frame admin portal.
  fields:
    entry_id:
      name: Config entry
    page_id:
      name: Page ID
      required: true
      example: "home-assistant"

show_mode_item:
  name: Show mode list item
  description: Show an item from the editable mode list in the photo frame admin portal.
  fields:
    entry_id:
      name: Config entry
    mode_item_id:
      name: Mode list item ID
      required: true
      example: "weather"

save_page:
  name: Save page
  description: Save a web page in the photo frame page list.
  fields:
    entry_id:
      name: Config entry
    name:
      name: Name
      required: true
      example: "Weather"
    url:
      name: URL
      required: true
      example: "https://example.com/dashboard"
    page_id:
      name: Page ID
      description: Optional stable ID. Leave empty to let the frame create one from the name.
      example: "weather"

delete_page:
  name: Delete page
  description: Delete a saved page from the photo frame page list.
  fields:
    entry_id:
      name: Config entry
    page_id:
      name: Page ID
      required: true
      example: "weather"

screen_on:
  name: Screen on
  description: Turn the Windows display on.
  fields:
    entry_id:
      name: Config entry

screen_off:
  name: Screen off
  description: Turn the Windows display off.
  fields:
    entry_id:
      name: Config entry

restart_pc:
  name: Restart PC
  description: Restart the Windows mini PC after the photo frame server schedules a 10 second restart.
  fields:
    entry_id:
      name: Config entry

show_mode:
  name: Show mode
  description: Switch to a built-in photo frame mode.
  fields:
    entry_id:
      name: Config entry
    mode:
      name: Mode
      required: true
      example: "slideshow"
